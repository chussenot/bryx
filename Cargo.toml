[package]
name = "bryx"
version = "0.1.0"
edition = "2021"
license = "MIT"
# src/bin/bench_render3d.rs (arkanoid-v2-c5) made this crate multi-binary,
# so `cargo run`/`mise run run` need to be told which one is the actual
# game -- otherwise cargo refuses to guess between it and bench_render3d.
default-run = "bryx"

[dependencies]
bytemuck = "1.25.2"
glyphon = "0.12.0"
# Decodes the optional Kenney asset pack (bead arkanoid-v2-b3,
# `assets::TextureSource::Pack`) into RGBA8 for `Atlas::set_sprite`.
# `default-features = false` + `features = ["png"]`: the pack this repo's
# fetch script produces is PNG-only, and every other format decoder
# (jpeg/gif/webp/tiff/...) the crate ships would just be dead compile
# weight on this fixed dependency budget. Explicitly authorized by this
# bead's bd description.
image = { version = "0.25.9", default-features = false, features = ["png"] }
rand = "0.10.2"
wgpu = "30.0.0"
winit = "0.30.13"
# src/render3d/ (arkanoid-v2-c1) needs a view/projection matrix and
# perspective divide for its cinematic camera. glam is the community-
# standard math crate for exactly this (see docs/spec.md's "no hand-rolled
# 4x4 math" framing) and its `Mat4::perspective_rh` already targets wgpu's
# 0..1 clip-space depth range, unlike hand-rolling the OpenGL -1..1
# convention wrong. Used only by render3d/ -- the classic 2D renderer has
# no matrices to justify pulling this in for itself.
glam = "0.33.3"
# The kinetic effects (src/fx/, docs/design/kinetic-fx.md) tessellate the
# shapes a quad cannot be: crack paths stroked with joins and caps from a
# real impact point, the concave fracture pieces cut along those cracks,
# arcs and rings with exact widths. Only the tessellator (and the path and
# geometry crates it re-exports): pure Rust, CPU-side, no GPU coupling, so
# it cannot clash with wgpu. Rectangles and lines stay on the quad fast
# path; Lyon builds only what needs a path.
lyon_tessellation = "1.0.23"

# --- autopilot (src/autopilot/) ---------------------------------------------
# Off by default so a fresh clone builds with the spec's dependency budget
# and no network stack. `--autopilot` works without it, on the deterministic
# lane heuristic; this feature adds the TypeSafe System One strategist.
[features]
default = ["audio"]
typesafe = ["dep:judgment", "dep:tokio", "dep:serde_json"]
# Sound (src/audio/): scores rendered at build time by Sonomorph's studio
# (build.rs) and played through its mixer and cpal stream. Without it the
# game is silent and needs neither a C compiler nor ALSA headers.
audio = ["sonomorph/output", "dep:sonomorph"]

[dependencies.sonomorph]
# BRYX's sound engine, extracted to its own crate so other games can use
# it (chussenot/sonomorph, its `advanced` branch: the studio): the mixer
# the director speaks to, always built (pure Rust: QOA decoding, mu-law,
# no features), and with `audio` its device stream through cpal
# (`output`; on Linux it needs libasound2-dev). Replaces the cpal
# dependency and src/audio/{mixer,qoa,mulaw,output}.rs.
git = "https://github.com/chussenot/sonomorph"
rev = "3c2eaf0ea03a673a339ebf35af7b074d683e3981"
default-features = false

[build-dependencies.wesl]
# The effects' shaders are WESL modules (src/shaders/): shared color,
# glow, distortion and noise functions imported by the geometry, bloom and
# composite shaders instead of being pasted or `format!`ed together.
# build.rs compiles them to plain WGSL in OUT_DIR (unused functions
# stripped), so the game itself carries no WESL code at run time and the
# output is independent of the wgpu version. Needs Rust 1.97.1 or later.
version = "0.6.0"

[build-dependencies.sonomorph]
# The same crate's `render-advanced` feature, for build.rs: the studio
# (which lived in audio/engine/) and its instrument library (the desk, the
# orchestra and its VSCO samples, the synth palette, which lived in
# audio/instruments/ and audio/samples/) render audio/score/**/*.score.
# Replaces the cc build-dependency and the C sources; it needs a C compiler.
git = "https://github.com/chussenot/sonomorph"
rev = "3c2eaf0ea03a673a339ebf35af7b074d683e3981"
features = ["render-advanced"]
optional = true

[dependencies.judgment]
# The typed System One client: questions with typed answers, every answer
# verified against the question before it is read (an off-list lane is an
# error, never a default), and the official SDKs' retry semantics.
version = "0.17"
optional = true

[dependencies.tokio]
# `judgment` is async; the autopilot runs it on one worker thread with a
# current-thread runtime (`autopilot/advisor.rs`), never on the game loop.
version = "1"
features = ["rt", "time"]
optional = true

[dependencies.serde_json]
# The state sent with each question (`judgment` takes a `serde_json::Value`).
version = "1"
optional = true
